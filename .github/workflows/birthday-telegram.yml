name: Birthday Telegram cron

# Hourly check — the Edge Function only posts when local send_hour matches.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger birthday-telegram
        env:
          # Public project URL (same as keepalive / the live site).
          SUPABASE_URL: 'https://vwziwqqscpaqvudxdafw.supabase.co'
          CRON_SECRET: ${{ secrets.SHAJIRA_TELEGRAM_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing SHAJIRA_TELEGRAM_CRON_SECRET"
            echo "Set it under Settings → Secrets and variables → Actions"
            echo "(same value as Supabase Edge secret TELEGRAM_CRON_SECRET)."
            exit 1
          fi
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/birthday-telegram" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}'
